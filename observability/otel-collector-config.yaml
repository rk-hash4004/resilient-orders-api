receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
connectors:
  spanmetrics:
    histogram:
      explicit:
        buckets: [10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s]
exporters:
  debug:
    verbosity: basic
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  otlp/lgtm:
    endpoint: lgtm:4317
    tls:
      insecure: true
service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug, otlp/jaeger, otlp/lgtm, spanmetrics]
    metrics:
      receivers: [otlp, spanmetrics]
      exporters: [debug, otlp/lgtm]
    logs:
      receivers: [otlp]
      exporters: [debug, otlp/lgtm]
